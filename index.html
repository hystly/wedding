<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero">
        <div class="language-toggle">

            <button id="langToggle">
                EN
            </button>

        </div>
        <div class="overlay">
            <h3 id="getMarried">WE'RE GETTING MARRIED</h3>

            <h1 id="hs">
                Hong Shiong
            </h1>
                <br>
            <h1>
                ❤️
            </h1>
                <br>
             <h1 id="ly">
                Li Yin
            </h1>

            <p id="date">29 November 2026</p>

            <p id="welcomeUser"></p>

        </div>
    </section>

    <div class="tabs">
        <a id="tabWish" href="#wishes">Wishes</a>
        <a id="tabPhoto" href="#photos">Photos</a>
    </div>

    <section id="stats">

        <div class="stats-card">

            <div class="stat-item">

                <div id="wishCount">💌 0</div>

                <span id="blessingsLabel">Blessings</span>

            </div>

            <div class="stat-item">

                <div id="photoCount">📸 0</div>

                <span id="memoriesLabel">Memories</span>

            </div>

        </div>

    </section>
    
    <section id="wishes">
        <h2 id="wishTitle">💌 Wishes Wall</h2>
        <div id="mostLovedWish" class="top-wish"></div>

        <div id="wishWall" class="wish-wall">

            <div id="lane0" class="lane"></div>

            <div id="lane1" class="lane"></div>

            <div id="lane2" class="lane"></div>

            <div id="lane3" class="lane"></div>

        </div>

        <button 
            id="sendWish"
            class="wish-button">
            Send Wishes
        </button>

    </section>
    
    <section id="photos">
        <h2 id="photoTitle">📸 Guest Memories</h2>

        <div
            id="mostLovedPhoto"
            class="top-photo">
        </div>

        <div class="photo-wall">
            <div
                id="photoSlideshow"
                class="photo-slideshow">
            </div>
        </div>

        <button
        id="photoButton"
        class="wish-button">

        Upload Photo

        </button>
    </section>

    <div id="doubleHappinessContainer"></div>

    <div id="usernameModal" class="username-modal">

        <div class="username-box">

            <h2>Welcome 😊 欢迎</h2>

            <div class="language-selector">

                <button
                id="englishBtn"
                class="lang-btn">
                English
                </button>

                <button
                id="chineseBtn"
                class="lang-btn">
                中文
                </button>

            </div>

            <p>How can I address you? 怎样称呼您？</p>

            <input
            id="usernameInput"
            type="text"
            placeholder="Your username"
            >

            <button
            id="saveUsername"
            class="wish-button username-button">

            Continue

            </button>

        </div>

    </div>

    <div id="topPhotoModal" class="image-modal">
        <img id="topPhotoPreview">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
