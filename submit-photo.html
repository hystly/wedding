<!DOCTYPE html>
<html>
<head>
  <title>Upload Photo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="photo-form-page">

    <h1>📸 Share Your Memories</h1>

    <input
      id="name"
      type="text"
      placeholder="Choose your photo">

    <input
      id="photo"
      type="file"
      accept="image/*">

    <button
      id="submitPhoto"
      class="wish-button">

      Upload Photo

    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="submit-photo.js"></script>

</body>
</html>
