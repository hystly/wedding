<!DOCTYPE html>
<html>
<head>
  <title>Upload Photo</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="photo-form-page">

    <h1 id="submitPhotoTitle" class="photo-title">📸 Share Your Memories</h1>

    <input
      id="photo"
      type="file"
      accept="image/*">

    <button id="submitPhoto" class="wish-button">Submit Photo</button>
    <button id="backHome" class="secondary-button">Back to Homepage</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="submit-photo.js"></script>

</body>
</html>
